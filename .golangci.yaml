version: "2"
linters:
  default: none
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - containedctx
  - depguard
  - gocritic
  - godot
  - gosec
  - misspell
  - modernize
  - nakedret
  - nlreturn
  - noctx
  - revive
  - testifylint
  - unconvert
  - unparam
  - whitespace
  - wsl_v5
  settings:
    depguard:
      rules:
        # A module's tests may set up users and areas with auth and core.
        module-imports:
          list-mode: lax
          files:
          - "**/internal/testkit/**"
          - "**/internal/notes/**"
          - "**/internal/tasks/**"
          - "**/internal/knowledge/**"
          - "**/internal/push/**"
          - "!$test"
          allow:
          - github.com/mhersson/recallsynapsis/internal/module$
          - github.com/mhersson/recallsynapsis/internal/store$
          deny:
          - pkg: github.com/mhersson/recallsynapsis
            desc: a module imports module and store and no other package of this binary
        module-importers:
          files:
          - "$all"
          - "!$test"
          - "!**/internal/api/**"
          - "!**/cmd/**"
          deny:
          - pkg: github.com/mhersson/recallsynapsis/internal/notes
            desc: nothing but api and cmd imports a module
          - pkg: github.com/mhersson/recallsynapsis/internal/tasks
            desc: nothing but api and cmd imports a module
          - pkg: github.com/mhersson/recallsynapsis/internal/knowledge
            desc: nothing but api and cmd imports a module
          - pkg: github.com/mhersson/recallsynapsis/internal/push
            desc: nothing but api and cmd imports a module
        # So the fake never reaches the binary.
        testkit-importers:
          files:
          - "$all"
          - "!$test"
          deny:
          - pkg: github.com/mhersson/recallsynapsis/internal/testkit
            desc: only tests import the fake module
    nakedret:
      max-func-lines: 5
  exclusions:
    generated: lax
    presets:
    - common-false-positives
    - std-error-handling
    - comments
issues:
  max-same-issues: 8
formatters:
  enable:
  - gofumpt
  - goimports
