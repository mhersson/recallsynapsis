name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer pull-request run cancels the older one; a running
# push or workflow_dispatch run finishes and a pending one is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Runs before make: the action puts golangci-lint on PATH, and fmt-check
      # needs the binary.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: make gates
        run: make build-go fmt-check vet test-race tidy-check scan size

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make web-install

      - run: make web-check

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The full history, so the scan can walk the pull request's commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: make scan-commits
        run: make scan-commits SCAN_BASE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  image:
    needs: [go-checks, govulncheck, web]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, recallsynapsis-image]
    steps:
      # The full history and the tags, for git describe. The runner's workspace
      # outlives the job and nothing after the checkout needs the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: tags
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          sha7="${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tags="$REGISTRY/recallsynapsis:$sha7 $REGISTRY/recallsynapsis:latest"
          else
            slug="${GITHUB_REF_NAME,,}"
            slug="${slug//[^a-z0-9.-]/-}"
            tags="$REGISTRY/recallsynapsis:${slug:0:50}-$sha7"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"

      - name: build and push
        run: |
          read -r -a tags <<< "$TAGS"
          args=()
          for t in "${tags[@]}"; do
            args+=(-t "$t")
          done
          docker build --build-arg VERSION="$(git describe --tags --always)" "${args[@]}" .
          for t in "${tags[@]}"; do
            docker push "$t"
          done

      # The runner's host is shared, so only this job's own tags are removed.
      - name: remove tags
        if: always()
        run: |
          read -r -a tags <<< "$TAGS"
          for t in "${tags[@]}"; do
            docker image rm "$t" || true
          done
